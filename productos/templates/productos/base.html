<!DOCTYPE html>
<html>
<head>
    <title>🎮 Zona Gamer de Kevin 🎮</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            padding: 0;
            background: url('https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif') no-repeat center center fixed;
            background-size: cover;
            color: #00ff00;
        }
        .content {
            padding: 20px;
            max-width: 900px;
            margin: auto;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 8px rgba(0, 255, 0, 0.5);
            border-radius: 10px;
            animation: fadeIn 1s ease-in-out;
            border: 2px solid #00ff00;
        }
        h1, h2 {
            text-align: center;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #ff00ff;
            font-size: 1.2rem;
        }
        a {
            color: #00ff00;
            text-decoration: none;
            font-size: 0.9rem;
        }
        a:hover {
            color: #ff00ff;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #00ff00;
        }
        footer a {
            margin: 0 10px;
            color: #00ff00;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #ff00ff;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
    <footer>
        <p>Sígueme en mis redes sociales:</p>
        <a href="https://www.instagram.com/_kevinarcos/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://wa.me/+593968167466" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.tiktok.com/@kevinoag" target="_blank"><i class="fab fa-tiktok"></i></a>
    </footer>
</body>
</html>
